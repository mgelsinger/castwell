name: Windows distributions

on:
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: 'Verify distributions from this run instead of building (leave blank for a full build)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate verification run ID
        if: ${{ inputs.verification_run_id != '' }}
        shell: pwsh
        env:
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          if ($env:VERIFICATION_RUN_ID -notmatch '^[0-9]+$') { throw 'Verification run ID must be numeric' }
      - name: Download previously built distributions
        if: ${{ inputs.verification_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-cuda-distributions
          path: .local/windows-verification-input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verification_run_id }}
      - name: Validate and stage reused distributions
        if: ${{ inputs.verification_run_id != '' }}
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import tomllib
          from scripts.build_windows import digest, source_fingerprint

          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          staging = (workspace / '.local/windows-verification-input').resolve()
          source = (staging / 'dist/windows').resolve()
          destination = (workspace / 'dist/windows').resolve()
          if not staging.is_relative_to(workspace) or not source.is_relative_to(staging) or not destination.is_relative_to(workspace):
              raise ValueError('Distribution staging paths must remain inside the workspace')
          version = tomllib.loads((workspace / 'pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise ValueError('Unexpected application version')
          prefix = f'Castwell-{version}-Windows-x64'
          expected = {f'{prefix}-Portable.zip', f'{prefix}-Setup.exe', f'{prefix}-manifest.json', 'SHA256SUMS.txt'}
          if not source.is_dir() or {path.name for path in source.iterdir()} != expected:
              raise ValueError('Downloaded artifact must contain exactly the expected distribution files')
          files = {name: (source / name).resolve() for name in expected}
          if any(not path.is_relative_to(source) or not path.is_file() for path in files.values()):
              raise ValueError('Unsafe or missing distribution file')
          manifest = json.loads(files[f'{prefix}-manifest.json'].read_text(encoding='utf-8'))
          if (manifest.get('application') != 'Castwell' or manifest.get('version') != version
                  or manifest.get('platform') != 'windows-x64' or manifest.get('inference') != 'nvidia-cuda-only'
                  or manifest.get('source_tree_sha256') != source_fingerprint(workspace)):
              raise ValueError('Reused distributions do not match the current CUDA application source')
          artifacts = manifest.get('artifacts', [])
          package_names = {f'{prefix}-Portable.zip', f'{prefix}-Setup.exe'}
          if len(artifacts) != 2 or {item.get('name') for item in artifacts} != package_names:
              raise ValueError('Manifest must identify both distribution packages')
          hashes = {name: digest(path) for name, path in files.items() if name != 'SHA256SUMS.txt'}
          for item in artifacts:
              path = files[item['name']]
              if path.stat().st_size != item.get('bytes') or hashes[item['name']] != item.get('sha256'):
                  raise ValueError(f'Distribution hash or size mismatch: {path.name}')
          expected_sums = {f'{value}  {name}' for name, value in hashes.items()}
          if set(files['SHA256SUMS.txt'].read_text(encoding='utf-8').splitlines()) != expected_sums:
              raise ValueError('Distribution checksums do not match the downloaded files')
          destination.mkdir(parents=True, exist_ok=True)
          if any(destination.iterdir()):
              raise ValueError('Refusing to replace existing distribution output')
          for name, path in files.items():
              target = (destination / name).resolve()
              if not target.is_relative_to(destination):
                  raise ValueError('Unsafe distribution destination')
              shutil.move(str(path), str(target))
          # Keep the previous run's report isolated; the smoke writes fresh evidence.
          print(f'Verified and staged {version} packages from the requested run')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Reused distribution validation failed' }
      - name: Verify source-build compiler prerequisites
        if: ${{ inputs.verification_run_id == '' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Visual Studio discovery is required for source builds' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC x64 build tools are required' }
          $version = (Get-Content packaging/windows-pyav.lock.json | ConvertFrom-Json).msvc_tools_version
          foreach ($name in @('cl.exe', 'lib.exe')) {
            $tool = Join-Path $vs "VC/Tools/MSVC/$version/bin/Hostx64/x64/$name"
            if (-not (Test-Path -LiteralPath $tool)) { throw "The pinned MSVC $version toolset is required" }
          }
          "VSINSTALLDIR=$vs" >> $env:GITHUB_ENV
          # CMake, Ninja and GCC come from the hash-pinned private w64devkit.
      - name: Fetch and build verified native CUDA dependencies
        if: ${{ inputs.verification_run_id == '' }}
        run: python scripts/fetch_windows_dependencies.py --output .local/windows-vendor-cuda
      - name: Prepare compiler and release inputs
        if: ${{ inputs.verification_run_id == '' }}
        shell: pwsh
        run: |
          $vendor = Get-Content .local/windows-vendor-cuda/vendor-manifest.json | ConvertFrom-Json
          $compilerDir = Join-Path $env:GITHUB_WORKSPACE '.local/windows-tools/inno'
          $install = Start-Process -FilePath $vendor.inno_installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /NOICONS /DIR=`"$compilerDir`"" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Inno compiler installation failed' }
          # Keep only the binary stages used by the build, avoiding duplicate
          # extracted CUDA packages on the hosted runner's limited disk.
          foreach ($name in @('cuda','cudnn','cufft','curand','nvrtc','downloads')) {
            $path = [IO.Path]::GetFullPath((Join-Path "$env:GITHUB_WORKSPACE/.local/windows-vendor-cuda" $name))
            $root = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE/.local/windows-vendor-cuda") + [IO.Path]::DirectorySeparatorChar
            if (-not $path.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid vendor cleanup path' }
            Remove-Item -LiteralPath $path -Recurse -Force
          }
      - name: Build installer and portable ZIP
        if: ${{ inputs.verification_run_id == '' }}
        shell: pwsh
        run: |
          $vendor = Get-Content .local/windows-vendor-cuda/vendor-manifest.json | ConvertFrom-Json
          # CI has no corresponding-source archive input, so its packages remain
          # explicit incomplete candidates until that archive is independently bound.
          python scripts/build_windows.py --ffmpeg-dir $vendor.ffmpeg_dir --llama-dir $vendor.llama_dir --cuda-dir $vendor.cuda_dir --vc-runtime-dir $vendor.vc_runtime_dir --pyav-build-manifest $vendor.pyav_build_manifest --notices-dir $vendor.notices_dir --inno-path .local/windows-tools/inno/ISCC.exe --skip-runtime-check
          if ($LASTEXITCODE -ne 0) { throw 'Windows distribution build failed' }
      - name: Release temporary build storage before distribution checks
        if: ${{ inputs.verification_run_id == '' }}
        shell: pwsh
        run: |
          $root = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE/.local") + [IO.Path]::DirectorySeparatorChar
          foreach ($name in @('windows-build/frozen','windows-build/analysis','windows-vendor-cuda')) {
            $path = [IO.Path]::GetFullPath((Join-Path $root $name))
            if (-not $path.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid build cleanup path' }
            Remove-Item -LiteralPath $path -Recurse -Force
          }
      - name: Verify installation and explicit GPU requirement
        shell: pwsh
        run: |
          $portable = (Get-ChildItem dist/windows/*-Portable.zip).FullName
          $installer = (Get-ChildItem dist/windows/*-Setup.exe).FullName
          # Hosted Windows runners have no NVIDIA GPU. Actual CUDA ASR and
          # classifier release verification is performed on NVIDIA hardware.
          python scripts/smoke_windows_distribution.py --portable $portable --installer $installer --expect-no-gpu
          if ($LASTEXITCODE -ne 0) { throw 'Windows distribution smoke failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cuda-distributions
          path: |
            dist/windows/
            .local/windows-distribution-check/report.json
          if-no-files-found: ignore
          retention-days: 7
