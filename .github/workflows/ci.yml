name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run fixture and integration tests
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: node --check castwell/static/app.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg and development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python -m pip install -e '.[dev]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise desktop and mobile gallery
        run: python scripts/smoke_browser.py --chromium '' --artifacts artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check
          path: artifacts/browser
          if-no-files-found: ignore
          retention-days: 7
